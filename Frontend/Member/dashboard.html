<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard | Kaer Morhen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="common-styles.css" />
    <link rel="stylesheet" href="dashboard-styles.css" />
</head>
<body>
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-brands fa-wolf-pack-battalion logo-icon"></i>
                <span class="logo-text">Kaer Morhen</span>
                <i class="fa-brands fa-wolf-pack-battalion logo-icon"></i>
                <!-- Mobile Close Button -->
                <button class="mobile-close-btn" id="mobileCloseBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="../Home/home.html" class="nav-item">
                    <i class="fas fa-home nav-icon"></i>
                    <span class="nav-text">Home</span>
                </a>
                
                <a href="dashboard.html" class="nav-item active">
                    <i class="fa-solid fa-gauge"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
                
                <a href="books.html" class="nav-item">
                    <i class="fas fa-search"></i>
                    <span class="nav-text">Browse Books</span>
                </a>

                <a href="My_books.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span class="nav-text">My Borrows</span>
                </a>

                <a href="my_reservations.html" class="nav-item">
                    <i class="fas fa-bookmark"></i>
                    <span class="nav-text">My Reservations</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> 
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content - Only Stats Now -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h2 id="welcomeTitle">Welcome back!</h2>
                    <p class="subtitle">Here's your reading overview.</p>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Stats Cards - Vertical Layout -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="icon-box bg-red">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="fineAmount" class="text-danger">$0</h3>
                            <p>All Time Fines</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="icon-box bg-green">
                            <i class="fa-solid fa-book"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="borrowedCount">0</h3>
                            <p>All Time Books Borrowed</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="icon-box bg-purple">
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="reservationCount">0</h3>
                            <p>Pending Reservations</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile menu -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Scripts -->
    <script src="../General/auth.js"></script>
    <script src="dashboard.js"></script>
    <script src="../General/mobile-menu.js"></script>
</body>
</html>
