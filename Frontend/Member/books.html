<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Collection | Kaer Morhen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="common-styles.css" />
    <link rel="stylesheet" href="books-styles.css" />
</head>
<body>
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-brands fa-wolf-pack-battalion logo-icon"></i>
                <span class="logo-text">Kaer Morhen</span>
                <i class="fa-brands fa-wolf-pack-battalion logo-icon"></i>
                <!-- Mobile Close Button -->
                <button class="mobile-close-btn" id="mobileCloseBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="../Home/home.html" class="nav-item">
                    <i class="fas fa-home nav-icon"></i>
                    <span class="nav-text">Home</span>
                </a>
                
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-gauge"></i>
                    <span class="nav-text">Dashboard</span>
                </a>

                <a href="books.html" class="nav-item active">
                    <i class="fas fa-search"></i>
                    <span class="nav-text">Browse Books</span>
                </a>

                <a href="My_books.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span class="nav-text">My Borrows</span>
                </a>

                <a href="my_reservations.html" class="nav-item">
                    <i class="fas fa-bookmark"></i>
                    <span class="nav-text">My Reservations</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="page-title">
                    <h1>Library Collection</h1>
                    <p>Explore our vast collection of books</p>
                </div>
            </header>

            <div class="content-area">
                <!-- Filter Section -->
                <div class="filter-section">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input
                            type="text"
                            class="search-input"
                            id="searchInput"
                            placeholder="Search by book title..."
                        />
                    </div>
                    <div class="filters-group">
                        <select class="filter-select" id="categoryFilter">
                            <option value="">All Categories</option>
                        </select>
                        <select class="filter-select" id="authorFilter">
                            <option value="">All Authors</option>
                        </select>
                        <button class="btn-reset" onclick="resetFilters()">
                            <i class="fas fa-undo"></i> Reset
                        </button>
                    </div>
                </div>

                <!-- Results Info -->
                <div class="results-info">
                    Showing <span id="countBooks">0</span> books
                </div>

                <!-- Books Grid -->
                <div class="books-grid" id="booksGrid"></div>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile menu -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Scripts -->
    <script src="../General/auth.js"></script>
    <script src="books.js"></script>
    <script src="../General/mobile-menu.js"></script>
    <script>
        // Check authentication
        document.addEventListener('DOMContentLoaded', function() {
            if(!isLoggedIn()){
                window.location.href = "../Home/login.html";
            }
        });
    </script>
</body>
</html>
